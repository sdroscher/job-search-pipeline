name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete. Never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # templ-generated code calls the templ runtime, so the generator must
      # match the version in go.mod or CI compiles against a different API
      # than developers do. sqlc has no go.mod entry; keep this pin in step
      # with what contributors run locally (`sqlc version`).
      - name: Install generators
        env:
          SQLC_VERSION: v1.31.1
        run: |
          templ_version="$(go list -m -f '{{.Version}}' github.com/a-h/templ)"
          go install "github.com/a-h/templ/cmd/templ@${templ_version}"
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}"

      - name: Generate
        run: sqlc generate && templ generate

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -race

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
